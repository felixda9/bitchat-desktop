[package]
name = "bitchat-ble"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
btleplug = "0.13.5"
futures = "0.3"
log = "0.4.34"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Foundation"] }

[dev-dependencies]
bitchat-proto = { path = "../bitchat-proto" }
