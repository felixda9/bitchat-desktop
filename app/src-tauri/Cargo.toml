[package]
name = "bitchat-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitchat-core = { version = "0.1.0", path = "../../crates/bitchat-core" }
log = "0.4.34"
env_logger = "0.11.11"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Devices_Geolocation", "Foundation", "Win32_System_WinRT"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2.6.1"
tokio = { version = "1.54.1", features = ["time"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }
